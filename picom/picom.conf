backend = "glx";
vsync = true;

glx-copy-from-front = false;

blur-background = true;

blur-method = "dual_kawase";
blur-strength = 6;

opacity-rule = [
	# "90:class_g = 'kitty' && focused",
	# "50:class_g = 'kitty' && !focused",
	"94:class_g = 'zen' && !focused",
	"92:class_g = 'discord' && focused",
	"95:class_g = 'qutebrowser' && !focused",
	"50:class_g = 'st-256color' && !focused",
	"85:class_g = 'st-256color' && focused",
	"85:class_g = 'dwm'"
];
